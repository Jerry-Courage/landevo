kind = "web"
previewPath = "/"
title = "Landevo"
description = "A full-stack marketplace platform for land listings, offers, transactions, messaging, and admin management. Users can browse listings, make offers, track transactions, and communicate with other parties."
version = "1.0.0"
id = "artifacts/landevo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21072

[services.development]
run = "pnpm --filter @workspace/landevo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landevo", "run", "build" ]
serve = "static"
publicDir = "artifacts/landevo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21072"
BASE_PATH = "/"
